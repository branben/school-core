# GitHub Issue Fetcher Configuration
# Point the Agent School at a repo to autonomously triage and solve issues.
#
# The reserved value `__self__` means "the repo this checkout was cloned from"
# (resolved at runtime from `git remote get-url origin`, overridable via
# AGENT_SCHOOL_REPO / SCHOOL_REPO). This keeps the framework portable — a clone
# of sound-royale-ny self-configures to branben/sound-royale-ny with no edits.

repo: "__self__"        # owner/repo format, or "__self__" for the current checkout
poll_interval_seconds: 300        # How often to poll for new issues (seconds)
# Issue labels to fetch. EMPTY = no server-side label filter: fetch every open
# issue and let triage_classifier decide readiness (exactly what the School Loop
# workflow's `--once` path does by passing labels=None).
#
# Do NOT put a conjunction here. `gh` ANDs repeated --label flags, so a list of
# N labels means "carries all N" — `["bug","enhancement"]` matched ZERO issues
# on sound-royale-ny, where the eligible set is labelled `production-readiness`.
# github_fetcher.fetch_issues now ORs the list (one gh call per label, unioned),
# so a non-empty list is a union; still prefer empty unless you want to narrow.
labels: []

# Override difficulty based on label presence
difficulty_overrides:
  p0: hard
  p1: medium

# Override Director domain based on label presence
domain_overrides:
  security: code-review

# ── Multi-repo dispatch (per-repo teacher pairs + bookbag namespacing) ──
# When empty, the school runs against a single repo (the `repo` above) and
# every bookbag/teacher is namespaced under "__global__". When populated, the
# principal boots a CTO+COO teacher PAIR per listed repo and namespaces each
# bookbag under its target repo, so verdicts never collide across repos.
#
# Each entry:
#   slug:   "owner/repo" — must match gh's nameWithOwner (or "__self__")
#   checkout: local path where Orca clones/registers the repo (optional;
#             defaults to ~/.cache/<slug>/repos/<owner>__<repo>)
#   eval_overrides: optional per-repo difficulty/domain overrides (future)
# Single-repo mode (default): leave target_repos empty so --serve boots
# exactly ONE principal automation + a CTO/COO teacher pair (2 teachers),
# all namespaced under __global__. Re-enable multi-repo only when you
# deliberately want a CTO+COO pair PER target repo (which multiplies
# teacher worktrees and was the source of the worktree spray).
target_repos:
  - slug: "octocat/Hello-World"
    checkout: "~/.cache/school-core-repos/octocat__Hello-World"
    base_ref: "main"
    verification:
      policy: "strict"
      commands:
        - name: "compile"
          cmd: "python3 -m compileall -q ."
          cwd: "."
    pr_destination: "octocat/Hello-World"

# Slug of the repo that hosts the orchestrator + souls (school-core itself).
# Teacher worktrees for OTHER repos are created against that repo's checkout;
# the principal's own workspace stays here. Use "__self__" for the current
# checkout (the framework's own repo).
orchestrator_repo: "__self__"
