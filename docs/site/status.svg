<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 202" width="165" height="202" role="img" aria-label="School-core pipeline status as of 2026-08-18: 36 issues, 23 success, 8 error, 3 blocked in retry, 2 school-failed; 63.9 percent pass rate; average score 58.8.">
  <style>
    svg{stroke-linejoin:round;font-family:'Helvetica Neue',Arial,sans-serif}
    .bg{fill:#F0EEE6}
    .frame{fill:#FFFFFF;stroke:#D1CFC5;stroke-width:1.2}
    .sl{fill:#141413}
    .cl{fill:#D97757}
    .ol{fill:#788C5D}
    .fl{fill:#D1CFC5}
    .fll{fill:#E6E3DA}
    .ln{fill:#9C9B93}
    .tile{fill:#FFFFFF;stroke:#D1CFC5;stroke-width:1}
    .lbl{fill:#87867F;font-size:4.5px}
    .num{fill:#141413;font-size:8px;font-weight:700}
    .hd{fill:#141413;font-size:7px;font-weight:700}
    .sub{fill:#87867F;font-size:4px}
    @keyframes sr-grow{0%{transform:scaleY(0)}22%,100%{transform:scaleY(1)}}
    @keyframes sr-pulse{0%,100%{opacity:.35;transform:scale(.82)}50%{opacity:1;transform:scale(1)}}
    @keyframes sr-blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
    @keyframes sr-slide{0%{transform:translateY(-6px);opacity:0}100%{transform:translateY(0);opacity:1}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:sr-grow 1.4s cubic-bezier(.2,.8,.2,1) forwards}
    .b1{animation-delay:.05s}.b2{animation-delay:.22s}.b3{animation-delay:.39s}.b4{animation-delay:.56s}
    .dot{transform-box:fill-box;transform-origin:center}
    .pulse{animation:sr-pulse 1.8s ease-in-out infinite}
    .blink{animation:sr-blink 1s steps(1) infinite}
    .tile-g{animation:sr-slide .7s ease-out both}
    .t1{animation-delay:.0s}.t2{animation-delay:.08s}.t3{animation-delay:.16s}.t4{animation-delay:.24s}
    @media (prefers-reduced-motion: reduce){
      *{animation:none!important;transition:none!important}
      [class*="a-"],[class]{opacity:1!important;transform:none!important;stroke-dashoffset:0!important;stroke-dasharray:none!important}
    }
  </style>
  <rect class="bg" x="0" y="0" width="165" height="202"/>
  <rect class="frame" x="4" y="4" width="157" height="194" rx="3"/>
  <text class="hd" x="12" y="18">school-core</text>
  <text class="sub" x="12" y="25">run status · as of 2026-08-18</text>
  <g class="tile-g t1"><rect class="tile" x="12.0" y="32" width="34.5" height="22" rx="2"/>
  <text class="lbl" x="16.0" y="40">ISSUES</text>
  <text class="num sl" x="16.0" y="50">36</text></g>
  <g class="tile-g t2"><rect class="tile" x="48.0" y="32" width="34.5" height="22" rx="2"/>
  <text class="lbl" x="52.0" y="40">PASS</text>
  <text class="num ol" x="52.0" y="50">63.9%</text></g>
  <g class="tile-g t3"><rect class="tile" x="84.0" y="32" width="34.5" height="22" rx="2"/>
  <text class="lbl" x="88.0" y="40">AVG</text>
  <text class="num sl" x="88.0" y="50">58.8</text></g>
  <g class="tile-g t4"><rect class="tile" x="120.0" y="32" width="34.5" height="22" rx="2"/>
  <text class="lbl" x="124.0" y="40">BLOCKED</text>
  <text class="num cl" x="124.0" y="50">3</text></g>
  <line x1="22" y1="150" x2="143" y2="150" class="ln" stroke-width="0.8"/>
  <rect class="bar b1 ol" x="27" y="70" width="18" height="80" rx="1"/>
  <text class="lbl" x="36" y="157" text-anchor="middle">success</text>
  <rect class="bar b2 sl" x="55" y="122" width="18" height="28" rx="1"/>
  <text class="lbl" x="64" y="157" text-anchor="middle">error</text>
  <rect class="bar b3 cl" x="83" y="140" width="18" height="10" rx="1"/>
  <text class="lbl" x="92" y="157" text-anchor="middle">retry</text>
  <rect class="bar b4 cl" x="111" y="143" width="18" height="7" rx="1"/>
  <text class="lbl" x="120" y="157" text-anchor="middle">failed</text>
  <circle class="dot pulse ol" cx="20" cy="180" r="3"/>
  <text class="lbl" x="26" y="182">working · 23</text>
  <circle class="dot blink cl" cx="92" cy="180" r="3"/>
  <text class="lbl" x="98" y="182">blocked · 3</text>
  <text class="sub" x="12" y="195">source: last_run.json (sanitized)</text>
</svg>