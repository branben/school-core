<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 165 202" width="165" height="202" role="img" aria-label="Crew flow: brief to spawn to hermes to status to review. Hermes exits 2, decision gate branches to silent failure; review starved of data.">
  <style>    svg{stroke-linejoin:round;font-family:'Helvetica Neue',Arial,sans-serif}
