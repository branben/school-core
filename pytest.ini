[pytest]
testpaths = tests
# Repo uses a flat src/ layout (imports are `from src.core...`), so the
# project root must be importable. python3 -m pytest adds cwd implicitly;
# this makes the bare `pytest` entry point behave identically.
pythonpath = .
norecursedirs = .* build dist CVS _darcs {arch} *.egg venv .venv repos node_modules
timeout = 60
timeout_method = thread
addopts = -m "not live"
markers =
    live: requires the self-hosted Orca and OmniRoute integration environment
