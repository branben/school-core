# project_verify.yaml — what the hermetic verify gate (verify_gate.py) actually
# runs on this repo, inside `nix develop .#verifyShell`.
#
# HARD CONSTRAINT: every command here must run in a NETWORK-LESS shell with ONLY
# the pinned toolchain (node 22, python 3.12, git, pnpm — see flake.nix). There
# is no node_modules, no pip deps, no network access. So the honest checks are
# stdlib-only compile checks: "the compiler runs before the critic speaks"
# (campus.md #3) means the school's own code must at least parse byte-clean.
#
# Do NOT add npm/pytest/ruff commands here until the flake provisions their
# toolchains — they would fail with command-not-found inside the shell, get
# filtered as infrastructure noise by issue_bridge, and burn a nix spawn per
# issue for zero signal (the exact trap the earlier auto-discovery hit with
# orca/mobile's typecheck/lint/test).
#
# This file also SHADOWS the recursive package.json/pyproject.toml discovery:
# _discover_commands() returns it verbatim and skips inference, so the gate
# runs exactly what's declared below and nothing else.
verify:
  - name: core-python-compile
    cmd: python3 -m compileall -q *.py
    cwd: .

  # compileall only checks syntax — it never imports, so it prints PASS on a
  # module that cannot be imported (e.g. a forward reference evaluated at module
  # scope without `from __future__ import annotations`). Import the seam modules
  # for real so the gate fails closed on a non-importable module. Stdlib-only:
  # the seam imports nothing outside the stdlib and sibling modules, so this
  # fits the network-less verifyShell.
  - name: core-python-import
    cmd: python3 -c "import student_vm_runner, verifier_vm, model_relay, candidate_pr"
    cwd: .

  # Strict typecheck of the student VM runner seam, the task-scoped model
  # relay capability, and the clean verifier VM. Toolchain provisioned by the
  # flake (python312Packages.mypy) — no pip deps needed in the shell.
  # --follow-imports=silent keeps the scope on the seam files themselves.
  - name: student-vm-runner-typecheck
    cmd: mypy --strict --follow-imports=silent student_vm_runner.py model_relay.py verifier_vm.py
    cwd: .

  # Strict typecheck of the candidate-bound PR provider seam (Phase 1
  # PR-correctness): publication journal + provider adapter.
  - name: pr-provider-typecheck
    cmd: mypy --strict --follow-imports=silent pr_provider.py candidate_pr.py
    cwd: .

  # Import the hosted SmolMachines Cloud adapter so the gate reaches it on
  # a clean checkout (SCH-13). Stdlib-only, like core-python-import: the
  # adapter imports only the stdlib and the tracked student_vm_runner seam.
  - name: smol-cloud-runner-import
    cmd: python3 -c "import smol_cloud_runner"
    cwd: .
