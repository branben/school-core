<svg xmlns="http://www.w3.org/2000/svg" width="380" height="80" viewBox="0 0 380 80">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="colored"/>
      <feMerge>
        <feMergeNode in="colored"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="380" height="80" fill="url(#bg)" rx="8"/>
  <text x="20" y="32" font-family="monospace, monospace" font-size="12" fill="#4ade80">school-core</text>
  <text x="20" y="52" font-family="monospace, monospace" font-size="10" fill="#8b949e">Developmental AI Agent Framework</text>
  <text x="20" y="70" font-family="monospace, monospace" font-size="9" fill="#6e7681">910 tests · 3 roles · 2 judges · 0 sycophancy</text>
  <rect x="320" y="8" width="52" height="24" rx="4" fill="#161b22" stroke="#4ade80" stroke-width="1"/>
  <text x="346" y="25" font-family="monospace, monospace" font-size="11" fill="#4ade80" text-anchor="middle">live</text>
  <!-- Pulsing green dot -->
  <circle cx="330" cy="18" r="5" fill="#4ade80" filter="url(#glow)">
    <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#4ade80;#22c55e;#4ade80" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
