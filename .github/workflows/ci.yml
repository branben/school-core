name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Syntax check (compile all modules)
        run: python -m compileall -q -x "school-output" .
      - name: Lint (ruff, F-class)
        run: |
          CORE="issue_bridge.py conductor.py onboard.py review_packet.py bookbag.py a2a_bridge.py"
          ruff check $CORE src/ scripts/
          ruff check --select F821,F811,F822 tests/
      - name: Vault allowlist (privacy guard)
        run: python scripts/check_vault_allowlist.py --strict
      - name: Data PII guard
        run: python scripts/sanitize_data.py --verify
      - name: Cache crapper + dryer
        uses: actions/cache@v4
        with:
          path: /tmp/crapper, /tmp/dryer
          key: ${{ runner.os }}-ub-mode-v1
          restore-keys: |
            ${{ runner.os }}-ub-mode-
      - name: Ub-mode quality gate (crapper + dryer)
        run: |-
          python -m pip install --quiet --break-system-packages gitpython
          python - <<'PY'
          import subprocess, os, sys
          repos = {
              "crapper": "https://github.com/unclebob/crapper.git",
              "dryer":   "https://github.com/unclebob/dryer.git",
          }
          for name, url in repos.items():
              dest = f"/tmp/{name}"
              if not os.path.exists(dest):
                  subprocess.run(["git", "clone", "--depth", "1", url, dest], check=True)
              subprocess.run([sys.executable, "-m", "pip", "install", "-q", "--break-system-packages", dest], check=True)
          PY
          echo "running crapper (complexity, changed files)..."
          crapper --no-coverage --threshold 10 --changed src/ tests/ || {
            echo "::error::crapper failed — CRAP score exceeds threshold"
            exit 1
          }
          echo "running dryer (duplication, changed files)..."
          dryer --threshold 0.82 --changed src/ tests/ || {
            echo "::error::dryer found duplicate candidates at threshold 0.82"
            exit 1
          }
          echo "ub-mode quality gate passed"

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests with coverage
        run: |-
          python -m pytest -q -m "not live" --durations=20 -n auto \
            --cov=src --cov=scripts --cov-report=xml --cov-report=term \
            --cov-fail-under=80
          echo "coverage report generated (see job artifact for XML)"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}-${{ github.run_id }}
          path: coverage.xml
          retention-days: 30

  integration-gate:
    name: integration gate (runner check)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      runner_online: ${{ steps.check.outputs.runner_online }}
    steps:
      - name: Check school-core-mac runner liveness
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |-
          ONLINE=$(gh api repos/${{ github.repository }}/actions/runners \
            --jq '[.runners[] | select(.name == "school-core-mac" and .status == "online")] | length')
          if [ "$ONLINE" -ge 1 ]; then
            echo "runner_online=true" >> "$GITHUB_OUTPUT"
            echo "school-core-mac online — integration job will run"
          else
            echo "runner_online=false" >> "$GITHUB_OUTPUT"
            echo "::warning::school-core-mac is offline — skipping live-Orca integration tests this run"
          fi

  integration:
    name: integration (live Orca + OmniRoute)
    concurrency:
      group: school-core-live-orca
      cancel-in-progress: false
    needs: integration-gate
    runs-on: [self-hosted, omniroute]
    if: always() && needs.integration-gate.result == 'success' && needs.integration-gate.outputs.runner_online == 'true'
    timeout-minutes: 30
    env:
      ORCA_LIVE_TESTS: "1"
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      PATH: /usr/local/bin:/opt/homebrew/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python (venv)
        run: |-
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
      - name: Register checkout with Orca
        run: |-
          set -euo pipefail
          if ! orca status --json >/dev/null 2>&1; then
            echo "Orca runtime unreachable — launching it (idempotent)"
            orca open --json >/dev/null
          fi
          orca repo add --path "$PWD" --json
      - name: Verify Orca + OmniRoute gateway reachable
        run: |-
          orca status --json | head -c 200
          echo
          curl -sf -H "Authorization: Bearer ${OMNI...KEY}" \
            http://localhost:20128/v1/models >/dev/null && echo "gateway OK"
      - name: Run live-Orca + OmniRoute integration tests
        run: .venv/bin/python -m pytest -m live tests/test_orca_execution.py -v

  review-gate:
    name: review-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache uml-viewer
        uses: actions/cache@v4
        with:
          path: /tmp/uml-viewer
          key: ${{ runner.os }}-uml-viewer-v1
          restore-keys: |
            ${{ runner.os }}-uml-viewer-
      - name: Mechanical review gate
        run: |-
          python scripts/review_gate.py \
            --base "origin/${{ github.base_ref }}" \
            --head "HEAD"
      - name: Gate report (always shown, even on failure)
        if: always()
        run: |-
          set -uo pipefail
          python scripts/review_gate.py \
            --base "origin/${{ github.base_ref }}" \
            --head "HEAD" \
            --json > review-gate.json || true
          test -s review-gate.json || {
            echo "::error::review-gate.json is empty — the gate report did not render"
            exit 1
          }
          head -c 2000 review-gate.json
      - name: Advisory architecture UML check
        if: always()
        continue-on-error: true
        run: |-
          set -uo pipefail
          if ! command -v java >/dev/null 2>&1; then
            echo "::warning::Java not found — skipping UML advisory check"
            exit 0
          fi
          if ! command -v clj >/dev/null 2>&1; then
            echo "::warning::Clojure CLI not found — skipping UML advisory check"
            exit 0
          fi
          git clone --depth 1 https://github.com/unclebob/uml-viewer.git /tmp/uml-viewer 2>/dev/null || {
            echo "::warning::uml-viewer clone failed — skipping advisory check"
            exit 0
          }
          cd /tmp/uml-viewer
          MODEL_OUT="/tmp/uml-model.txt"
          clj -M:ir > "$MODEL_OUT" 2>/dev/null || {
            echo "::warning::uml-viewer execution failed — advisory only"
            exit 0
          }
          echo "UML advisory: architecture model generated ($MODEL_OUT)"
          BASELINE=".scratch/uml-baseline.txt"
          if [ -f "$BASELINE" ] && [ -s "$BASELINE" ]; then
            if diff -q "$BASELINE" "$MODEL_OUT" > /dev/null 2>&1; then
              echo "UML advisory: architecture matches baseline"
            else
              echo "::warning::UML architecture differs from baseline — see $MODEL_OUT vs $BASELINE"
              diff "$BASELINE" "$MODEL_OUT" || true
            fi
          else
            echo "::warning::No UML baseline found — creating one from current model"
            mkdir -p "$(dirname "$BASELINE")"
            cp "$MODEL_OUT" "$BASELINE"
            echo "UML baseline initialized at $BASELINE — commit it to lock the baseline"
          fi

  notify:
    name: alert on main-branch failure
    runs-on: ubuntu-latest
    needs: [lint, test, integration-gate, integration]
    if: always() && failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    env:
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      AGENTMAIL_SCHOOL_INBOX: vault-synthesis@agentmail.to
      TEST_RESULT: ${{ needs.test.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      GATE_RESULT: ${{ needs.integration-gate.result }}
      INTEGRATION_RESULT: ${{ needs.integration.result }}
      COMMIT_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Send AgentMail CI-failure alert
        run: |-
          python - <<'PY'
          import os
          from src.tools.school_mail import notify_build_failure

          failed = []
          if os.environ.get("TEST_RESULT") == "failure":
              failed.append("pytest (py3.9/3.11/3.12)")
          if os.environ.get("LINT_RESULT") == "failure":
              failed.append("lint")
          if os.environ.get("GATE_RESULT") == "failure":
              failed.append("integration gate (runner check)")
          if os.environ.get("INTEGRATION_RESULT") == "failure":
              failed.append("integration (live Orca + OmniRoute)")

          ok = notify_build_failure(
              workflow="CI",
              run_url=os.environ.get("RUN_URL", ""),
              commit_sha=os.environ.get("COMMIT_SHA", ""),
              branch=os.environ.get("BRANCH", ""),
              failed_jobs=failed,
              repo=os.environ.get("GITHUB_REPOSITORY", "__global__"),
          )
          print(f"notify_build_failure -> {ok}")
          PY
