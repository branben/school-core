name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (compile all modules)
        run: python -m compileall -q .

      - name: Run tests
        # Live-Orca tests are gated by ORCA_LIVE_TESTS=1 and skipped by default,
        # so this runs the full suite without requiring a running Orca daemon.
        run: python -m pytest -q

  integration-gate:
    # Hosted-runner pre-flight check for the live-Orca integration job. The
    # self-hosted runner lives on the Mac that hosts Orca + the OmniRoute
    # gateway — if that Mac is asleep/offline, the runner can't pick up the
    # job and it would sit in the queue (or worse, block on a hung job). This
    # gate checks runner liveness from a hosted runner so a sleeping Mac is a
    # clean "skipped" instead of a stuck or red run. Real breakage still
    # fails: when the runner IS online the integration job runs and its tests
    # hard-fail as usual.
    name: integration gate (runner check)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      runner_online: ${{ steps.check.outputs.runner_online }}
    steps:
      - name: Check school-core-mac runner liveness
        id: check
        env:
          # The runners API needs repo-admin scope; the default GITHUB_TOKEN
          # gets 403. RUNNER_ADMIN_TOKEN holds the repo owner's gh token.
          # Hardening: replace with a fine-grained PAT limited to this repo,
          # "Administration: Read" only.
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          ONLINE=$(gh api repos/${{ github.repository }}/actions/runners \
            --jq '[.runners[] | select(.name == "school-core-mac" and .status == "online")] | length')
          if [ "$ONLINE" -ge 1 ]; then
            echo "runner_online=true" >> "$GITHUB_OUTPUT"
            echo "school-core-mac online — integration job will run"
          else
            echo "runner_online=false" >> "$GITHUB_OUTPUT"
            echo "::warning::school-core-mac is offline — skipping live-Orca integration tests this run"
          fi

  integration:
    # Live-Orca + OmniRoute integration tests. These need a real Orca daemon
    # and the local OmniRoute gateway (localhost:20128), which only exist on
    # the self-hosted runner (school-core-mac, label: omniroute). They do NOT
    # run on GitHub's hosted runners.
    #
    # Runs on push only: running arbitrary PR code on a self-hosted runner is
    # a supply-chain risk, and fork PRs can't reach this machine's gateway.
    #
    # Gated on integration-gate: skips cleanly when the Mac (and thus the
    # runner) is offline, instead of queueing or hanging. always() is required
    # so the if-expression is evaluated even when the gate itself is skipped
    # (non-push events) or when GitHub's "needs" short-circuit applies.
    name: integration (live Orca + OmniRoute)
    needs: integration-gate
    runs-on: [self-hosted, omniroute]
    if: always() && needs.integration-gate.result == 'success' && needs.integration-gate.outputs.runner_online == 'true'
    timeout-minutes: 30
    env:
      ORCA_LIVE_TESTS: "1"
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      # The runner runs as a LaunchAgent with a minimal PATH — orca lives in
      # /usr/local/bin, so re-expose it (plus common Homebrew paths).
      PATH: /usr/local/bin:/opt/homebrew/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4

      # No actions/setup-python here: on this self-hosted runner the action's
      # tool-cache defaults to /Users/runner (a GitHub-hosted path) and fails
      # with EACCES. Use the machine's system Python + a workspace-local venv
      # instead — deterministic and tool-cache independent.
      - name: Set up Python (venv)
        run: |
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      # The checkout lives under ~/actions-runner/_work/... — a path Orca has
      # never seen. `orca terminal create` (no selector) resolves the CURRENT
      # worktree from cwd, so register the checkout with Orca first. Idempotent.
      - name: Register checkout with Orca
        run: orca repo add --path "$PWD" --json

      - name: Verify Orca + OmniRoute gateway reachable
        run: |
          orca status --json | head -c 200
          echo
          curl -sf -H "Authorization: Bearer ${OMNIROUTE_API_KEY}" \
            http://localhost:20128/v1/models >/dev/null && echo "gateway OK"

      - name: Run live-Orca + OmniRoute integration tests
        run: .venv/bin/python -m pytest tests/test_orca_execution.py -v
