# School Loop — Durable Cloud Board runner
#
# Runs every 5 minutes so the board stays published and state stays durable.
#
# Architecture (hybrid, 2026-08-10):
#   1. EXECUTION ON THE MAC — `execute` job runs on the self-hosted runner
#      (school-core-mac, label omniroute) because real task execution needs
#      the OmniRoute gateway (localhost:20128) + the Orca macOS sandbox,
#      which only exist on the Mac. Gated on runner liveness so a sleeping
#      Mac is a visible, alerted "blocked" cycle, never a hung run.
#   2. VIEW HOSTED — `loop` job runs on ubuntu-latest and always publishes
#      the board (ht-ml.app), so the board stays up even when the Mac sleeps.
#   3. STATE IN GIT — data/* is committed after scripts/sanitize_data.py
#      scrubs /Users/... and /home/runner/... paths, so board state survives
#      disk death without leaking PII. board-url.txt keeps the board link
#      discoverable.
#
# NOTE (2026-08-10): the pre-hybrid workflow ran the bridge on ubuntu-latest,
# where OMNIROUTE_API_KEY was unset, localhost:20128 does not exist, and Orca
# cannot run — every issue errored with "A2A fallback failed: OMNIROUTE_API_KEY
# is not set". Execution is Mac-bound by its dependencies; the loop cannot
# survive laptop death for the EXECUTION step, only for the board + state.

name: School Loop

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      orca_daemon:
        description: "Orca daemon identity for this fleet node (used to key the per-daemon execute lock)."
        required: false
        default: "default"
        type: string

# Do not let two 30-minute Mac executions overlap. Keep the current run alive;
# GitHub retains only one pending run, so the newest pending cycle wins.
concurrency:
  group: school-loop
  cancel-in-progress: false

# Default token is read-only. Jobs that checkpoint state or update issue
# lifecycle labels declare their narrower write permissions below.
permissions:
  contents: read

env:
  # SCHOOL_REPO is the issue backlog consumed by this school-core pipeline.
  # Keep the target explicit: this checkout hosts the orchestrator, while
  # students work in fresh target-repo clones and never in the dirty developer
  # checkout. Change deliberately if the pipeline is repointed elsewhere.
  SCHOOL_REPO: "branben/sound-royale-ny"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  gate:
    # Hosted-runner pre-flight check for the `execute` job. The self-hosted
    # runner lives on the Mac that hosts Orca + the OmniRoute gateway — if
    # that Mac is asleep/offline, the runner can't pick up the job and it
    # would sit in the queue. Same pattern as CI's integration-gate.
    name: execute gate (runner check)
    runs-on: ubuntu-latest
    outputs:
      runner_online: ${{ steps.check.outputs.runner_online }}
    steps:
      - name: Check school-core-mac runner liveness
        id: check
        env:
          # The runners API needs repo-admin scope; the default GITHUB_TOKEN
          # gets 403. RUNNER_ADMIN_TOKEN holds the repo owner's gh token.
          # HARDENING REQUIRED: replace with a fine-grained PAT scoped to
          # this repo with ONLY "Administration: Read".
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          # Guard the API call: a missing/expired RUNNER_ADMIN_TOKEN must degrade
          # to "runner offline" (skip execution) — never fail the gate, because
          # the hosted `loop` job publishes committed board state even when
          # execute is skipped. A token misconfig must not take down the board.
          ONLINE=$(gh api repos/${{ github.repository }}/actions/runners \
            --jq '[.runners[] | select(.name == "school-core-mac" and .status == "online")] | length' 2>/dev/null || true)
          ONLINE=${ONLINE:-0}
          case "$ONLINE" in
            ''|*[!0-9]*) ONLINE=0 ;;
          esac
          if [ "$ONLINE" -ge 1 ]; then
            echo "runner_online=true" >> "$GITHUB_OUTPUT"
            echo "school-core-mac online — execution job will run"
          else
            echo "runner_online=false" >> "$GITHUB_OUTPUT"
            echo "::warning::school-core-mac offline or unverifiable (check RUNNER_ADMIN_TOKEN) — skipping issue execution this cycle"
          fi

  pipeline-alert:
    # Separate from `gate`: a checkout or AgentMail failure must never make
    # the gate red, because `loop` relies on gate success to publish the board.
    name: alert if school loop is blocked
    needs: gate
    runs-on: ubuntu-latest
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.runner_online == 'false'
    continue-on-error: true
    steps:
      - name: Check out notification code
        uses: actions/checkout@v4

      - name: Notify pipeline blocked
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_SCHOOL_INBOX: vault-synthesis@agentmail.to
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Best-effort: this job is isolated and cannot block board publishing.
          python - <<'PY'
          import os
          from school_mail import notify_pipeline_alert

          ok = notify_pipeline_alert(
              component="school-core-mac runner",
              reason="The self-hosted runner is offline or the liveness token is missing/invalid.",
              repo=os.environ.get("GITHUB_REPOSITORY", "__global__"),
              run_url=os.environ.get("RUN_URL", ""),
          )
          print(f"notify_pipeline_alert -> {ok}")
          PY

  execute:
    # Real issue execution — runs ONLY on the Mac (gateway + Orca live there).
    # Skips execution when the Mac is asleep; the gate sends a pipeline-blocked
    # alert while the hosted loop still publishes committed board state. Commits
    # sanitized board state back
    # so the ubuntu `loop` job can publish it and state survives disk death.
    name: execute issues (live Orca + OmniRoute)
    # Shares the Mac's single Orca daemon + OmniRoute gateway with CI's live
    # integration job. This is the same cross-workflow lock as ci.yml, so
    # issue execution and integration tests cannot mutate Orca state together.
    concurrency:
      # N6.3 (worst-day-ever): key the lock on the Orca daemon identity, not one
      # global group. With a fleet of N daemons, each runs its own execute job
      # without mutual lock-out; a single stalled job only blocks its own daemon,
      # not the whole school. Set ORCA_DAEMON per self-hosted runner / fleet node.
      group: school-core-live-orca-${{ inputs.orca_daemon || 'default' }}
      cancel-in-progress: false
    needs: gate
    runs-on: [self-hosted, omniroute]
    permissions:
      contents: write
      issues: write
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.runner_online == 'true'
    timeout-minutes: 30
    env:
      # The secret that unlocks model calls — REQUIRED (execution fails loudly
      # without it). Same wiring as CI's integration job.
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      # AgentMail key for school-failed / retry-pending alerts. The bridge
      # degrades gracefully (no crash, no alert) when unset.
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      # The runner runs as a LaunchAgent with a minimal PATH — orca lives in
      # /usr/local/bin, so re-expose it (plus common Homebrew paths). The
      # FirstMate orca backend adapter shells out to `node` (its status-JSON
      # parsing is a node -e snippet), and node only exists via fnm here — the
      # interactive shells get it from a transient fnm multishell, but the
      # LaunchAgent never does. Pin the stable fnm default alias so crew
      # spawns can find node (observed 2026-08-12, issue #47: crew spawn
      # failed with 'node: command not found' from backends/orca.sh:27).
      PATH: /usr/local/bin:/opt/homebrew/bin:/Users/brandonbennett/.local/share/fnm/aliases/default/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
      # U8 crew dispatch: route the student-task through the FirstMate -> Orca
      # crew before the direct model path. The bridge reads this once per
      # cycle and falls back to the direct path on spawn failure / timeout /
      # blocked with retry-once carry, so a broken crew never strands an
      # issue. fm_doctor (preflight below) already hard-fails missing crew
      # infra, so by the time the bridge runs the crew path is expected live.
      CREW_ENABLED: "1"
      # Crew runs poll for minutes (CREW_TIMEOUT_SECONDS default 900s) and the
      # job is under a 30-min timeout. With 4-parallel students, each crew
      # needs ~720s (diploma 8 turns × 90s/turn) and the cycle budget must
      # accommodate all 4 running concurrently. CREW_MAX_PER_CYCLE caps how
      # many crews the bridge dispatches per cycle; CREW_RUNNER_SLOTS caps how
      # many run concurrently on this runner.
      CREW_MAX_PER_CYCLE: "4"
      CREW_RUNNER_SLOTS: "4"
      CREW_CYCLE_BUDGET_SECONDS: "3600"
      # VERIFY_GATE_STRICT (U3): uncomment to enforce campus #3 inside the
      # bridge. The workflow preflight below already hard-fails missing Nix or
      # verifyShell; this flag additionally escalates an internal/direct gate
      # failure into a real issue failure instead of a soft skip.
      # VERIFY_GATE_STRICT: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # No actions/setup-python here: on this self-hosted runner the action's
      # tool-cache defaults to /Users/runner (a GitHub-hosted path) and fails
      # with EACCES. Use the machine's system Python + a workspace-local venv.
      - name: Set up Python (venv)
        run: |
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      # The checkout lives under ~/actions-runner/_work/... — a path Orca has
      # never seen. `orca terminal create` (no selector) resolves the CURRENT
      # worktree from cwd, so register the checkout with Orca first. Idempotent.
      - name: Register checkout with Orca
        run: orca repo add --path "$PWD" --json

      # FirstMate crew preflight: diagnose a broken crew setup (missing
      # persistent clone, Orca daemon down, FM_HOME backend drift, hermes
      # wrapper/auth) with a clear PASS/FAIL report instead of a cryptic
      # mid-spawn error. INFRA FAILURES ARE FATAL: missing clone / Orca down /
      # wrapper gone fail the execute job (exit 1) so the breakage is loud;
      # the `loop` job still publishes the board from committed state (its
      # guard is the gate, not execute), and the bridge's retry-once
      # semantics carry any unprocessed issue to the next cycle. AUTH IS
      # NON-FATAL by design (FM_DOCTOR_WARN_AUTH=1): the bridge executes
      # through Orca directly today, so a missing provider token must not
      # block issue processing — the doctor still prints the WARN so the
      # token gap stays visible.

      # Gateway preflight: BOTH transports (OmniRoute /v1 and A2A /a2a) are
      # served by one process on localhost:20128. When it is down, every model
      # call fails, _a2a_poll burns its 120s deadline per attempt, retry
      # pressure accumulates until the crew denies admission, and the job
      # grinds until timeout-minutes kills it. Measured: 62 of 63 runs
      # cancelled at ~31min having processed ONE issue (run 32290180356 —
      # "A2A fallback failed: [Errno 61] Connection refused").
      #
      # This probe costs ~0.1s and converts that 30-minute silent grind into an
      # immediate, alerting failure. Deliberately NOT continue-on-error: a dead
      # gateway means this cycle cannot do useful work, and `cancelled` is a
      # far worse signal than `failure`. The hosted `loop` job still publishes
      # committed board state, so a red execute does not take down the board.
      - name: Gateway preflight (OmniRoute + A2A liveness)
        env:
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: .venv/bin/python gateway_preflight.py

      - name: FirstMate crew preflight (fm_doctor)
        env:
          # Auth is a WARN here: a missing provider token must not block issue
          # execution (the bridge logs the failure and retry-once carries it),
          # but infra problems (missing clone, Orca down, wrapper gone) stay
          # fatal and fail the job with the doctor's clear report.
          FM_DOCTOR_WARN_AUTH: "1"
        run: |
          scripts/fm_doctor.sh
          echo "fm_doctor: crew setup OK — proceeding with issue execution"

      # Verify toolchain preflight (U3): nix + flake.nix#verifyShell must be
      # present for the "compiler before critic" promise to hold. This is a
      # hard preflight: if the compiler layer cannot run, the execute job must
      # fail clearly rather than report a green cycle that did no verification.
      - name: Verify toolchain preflight (nix + verifyShell)
        run: |
          NIX_BIN=$(command -v nix || echo /nix/var/nix/profiles/default/bin/nix)
          if [ ! -x "$NIX_BIN" ]; then
            echo "::error::nix not found (PATH + Determinate path) — cannot run verify gate"
            exit 1
          fi
          # verifyShell is a devShell (flake.nix: devShells.aarch64-darwin.
          # verifyShell; the flake hardcodes system = "aarch64-darwin"). The
          # `.#verifyShell` shorthand resolves for `nix develop` but NOT for
          # `nix eval` (it only falls back to packages/defaultPackage/
          # legacyPackages), so the full attr path is required or this check
          # always fails (2026-08-12).
          SHELL_NAME=$("$NIX_BIN" eval --raw .#devShells.aarch64-darwin.verifyShell.name 2>/dev/null)
          if [ -z "$SHELL_NAME" ]; then
            echo "::error::flake.nix#verifyShell did not evaluate — cannot run verify gate"
            exit 1
          fi
          echo "toolchain preflight OK — nix at $NIX_BIN, verifyShell=$SHELL_NAME"

      - name: Populate issue cache from GitHub
        run: .venv/bin/python populate_board_cache.py

      - name: Run bridge loop (executes issues)
        run: .venv/bin/python -m issue_bridge --repo "$SCHOOL_REPO" --once

      - name: Sanitize + commit board state (durable, PII-free)
        # "STATE IN GIT" durability axis: scrub home paths out of the runtime
        # JSON, then commit data/* so board state survives disk death. PII
        # never reaches the public repo. pull --rebase makes the push
        # self-healing against overlapping runs.
        run: |
          # scores.json carries the school's cross-cycle memory (agent leaderboard
          # used for selection + gate progression); retry_issues.json carries the
          # retry-once counter for transiently failed issues; trajectories/ is the
          # Layer 2 corpus (U2) — without it every fresh checkout is amnesiac. All
          # must survive the fresh checkout each cycle — commit them sanitized.
          # --trim-trajectories caps trajectory history to the newest N files so
          # Layer 2 memory persists without unbounded repo growth.
          .venv/bin/python scripts/sanitize_data.py --trim-trajectories --trim-consolidations data/last_run.json data/issues_cache.json data/processed_issues.json data/scores.json data/retry_issues.json data/crew_runs.json
          # The sanitizer exits non-zero if any consolidation still contains
          # a home path, sensitive field, or recognizable token.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only sanitized, schema-owned artifacts are checkpointed. Do not
          # force-add arbitrary runtime files from the consolidation tree. The
          # seeded index.md (tracked Layer-3 archival README) is expected; any
          # OTHER non-YAML file means the consolidation writer left runtime
          # junk behind and the cycle must fail loudly (2026-08-12: U1
          # session_id threading made consolidation YAMLs appear every cycle,
          # which exposed that the guard predates the tracked index.md seed).
          if find data/sessions/consolidation -type f ! -name '*.yaml' ! -name 'index.md' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::unexpected non-YAML file under data/sessions/consolidation"
            exit 1
          fi
          # data/crew_runs.json is the U8 crew registry — the durable record
          # the cross-cycle in-flight skip + stale sweep rely on. It MUST be
          # checkpointed too, or every fresh checkout starts with an empty
          # registry and an interrupted crew can double-spawn next cycle.
          #
          # Each add is INDEPENDENT and glob-safe (2026-08-12 fix): a single
          # unmatched pathspec like data/sessions/consolidation/*/*.yaml makes
          # `git add` abort the WHOLE command with 'fatal: pathspec did not
          # match', so one empty dir silently blocked every state commit — the
          # bridge's run records (scores, last_run, crew registry) stayed
          # modified-but-unstaged and the board lost the cycle. `find` only
          # adds real files, so a missing trajectories/ dir or an empty
          # consolidation tree can never kill the checkpoint.
          git add -f data/last_run.json data/issues_cache.json data/processed_issues.json data/scores.json data/retry_issues.json data/crew_runs.json 2>/dev/null || true
          find data/trajectories -type f -exec git add -f {} + 2>/dev/null || true
          find data/sessions/consolidation -name '*.yaml' -exec git add -f {} + 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "checkpoint: no state changes to commit"
          else
            git commit -m "chore: checkpoint board state (sanitized) [skip ci]" \
              && git push --force-with-lease origin HEAD:board-publish \
              && echo "checkpoint: pushed $(git rev-parse --short HEAD) to board-publish" \
              || echo "::warning::checkpoint commit/push failed (self-heals next cycle)"
          fi

  loop:
    # Board publishing — always runs (even when the Mac sleeps, even if
    # execute failed), from the latest committed state. Serialized after
    # `execute` (needs) so the two jobs never race their git pushes; the
    # pull below picks up the sanitized data/* that execute just committed.
    name: publish board (hosted)
    needs: [gate, execute]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    # `always()` keeps the hosted board alive even if the runner gate itself
    # errors before it can report a normal offline=false output.
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest committed board state
        # The `execute` job (Mac) may have committed fresh data/* in the same
        # cycle and force-pushed to board-publish. Reset to it directly so we
        # don't hit a rebase conflict from the diverged option-b commits on
        # board-publish. Board-publish is a linear force-pushed target, so
        # reset --hard is safe here.
        run: git fetch origin board-publish && git reset --hard origin/board-publish

      - name: Populate issue cache from GitHub
        run: python populate_board_cache.py

      - name: Publish board to ht-ml.app
        # Regenerate board.html from the just-generated local data/, re-share,
        # and record the (rotating) URL in board-url.txt so it stays
        # discoverable. ht-ml.app has no in-place update flag, so each share
        # yields a new URL — board-url.txt is the source of truth.
        run: |
          python -c "
          import json
          from pathlib import Path
          from board import build_board_html
          def load(ref):
              try: return json.loads(Path(ref).read_text() or '[]')
              except Exception: return []
          cache = load('data/issues_cache.json')
          proc = load('data/processed_issues.json')
          lr = load('data/last_run.json')
          # The bridge now closes processed issues, so they drop out of the
          # open-issues cache. Merge them back from last_run (which records
          # title/domain/difficulty on success) so Done cards keep their
          # history on the board.
          cache_nums = {c.get('issue_number') for c in cache}
          for e in lr:
              n = e.get('issue')
              if n in cache_nums or n not in set(proc) or e.get('status') != 'success':
                  continue
              cache.append({
                  'issue_number': n,
                  'title': e.get('title') or ('Issue #%s' % n),
                  'domain': e.get('domain', ''),
                  'difficulty': e.get('difficulty', ''),
                  'state': 'done',
              })
              cache_nums.add(n)
          Path('board.html').write_text(build_board_html(cache, proc, lr))
          print('regenerated board.html')
          "
          # re-share (URL rotates each time; record it)
          URL=$(npx -y lavish-axi share board.html 2>/dev/null | grep -oE 'https://[a-z0-9]+\.ht-ml\.app/' | head -1)
          echo "$URL" > board-url.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f board-url.txt 2>/dev/null || true
          git commit -m "chore: publish board [skip ci]" && git push --force-with-lease origin HEAD:board-publish
