# School Loop — Durable Cloud Board runner
#
# Runs every 5 minutes so the board stays published and state stays durable.
#
# Architecture (simplified 2026-08-26):
#   1. EXECUTION ON THE MAC — `execute` job runs on the self-hosted runner
#      (school-core-mac, label omniroute) because real task execution needs
#      the OmniRoute gateway (localhost:20128) + the Orca macOS sandbox,
#      which only exist on the Mac. Gated on runner liveness so a sleeping
#      Mac is a visible, alerted "blocked" cycle, never a hung run.
#   2. STATE IN GIT — data/* is committed to board-publish after
#      scripts/sanitize_data.py scrubs /Users/... and /home/runner/... paths,
#      so board state survives disk death without leaking PII. Linear history
#      (no force-push) so pushes never race or corrupt.
#   3. BOARD ON GITHUB PAGES — board.html is published to the gh-pages branch,
#      served at https://branben.github.io/school-core/ (stable URL, no rotation).
#   4. STATUS IN status.json — commit SHA + timestamp + issue count published
#      alongside the board for debugging ("which code version ran?").
#
# CHANGES from the previous version:
#   - Removed the `loop` job (hosted board publisher). It force-pushed to
#     board-publish every cycle, causing git races and "stale info" rejections.
#     The rotating ht-ml.app URL it produced was also undiscoverable without
#     checking board-url.txt — which the user never did.
#   - Board publishing now happens in the `execute` job, pushing to gh-pages.
#   - Seed step fails loud (no more `|| echo ::warning::`) — if board-publish
#     can't be read, the bridge must not run on stale data.
#   - board-url.txt is no longer needed (stable GitHub Pages URL).

name: School Loop

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      orca_daemon:
        description: "Orca daemon identity for this fleet node (used to key the per-daemon execute lock)."
        required: false
        default: "default"
        type: string

# Do not let two 30-minute Mac executions overlap. Keep the current run alive;
# GitHub retains only one pending run, so the newest pending cycle wins.
concurrency:
  group: school-loop
  cancel-in-progress: false

# Default token is read-only. Jobs that checkpoint state or update issue
# lifecycle labels declare their narrower write permissions below.
permissions:
  contents: read

env:
  # SCHOOL_REPO is the issue backlog consumed by this school-core pipeline.
  SCHOOL_REPO: "branben/sound-royale-ny"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  gate:
    # Hosted-runner pre-flight check for the `execute` job. The self-hosted
    # runner lives on the Mac that hosts Orca + the OmniRoute gateway — if
    # that Mac is asleep/offline, the runner can't pick up the job and it
    # would sit in the queue. Same pattern as CI's integration-gate.
    name: execute gate (runner check)
    runs-on: ubuntu-latest
    outputs:
      runner_online: ${{ steps.check.outputs.runner_online }}
      status: ${{ steps.check.outputs.status }}
    steps:
      - name: Check school-core-mac runner liveness
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          ONLINE=$(gh api repos/${{ github.repository }}/actions/runners \
            --jq '[.runners[] | select(.name == "school-core-mac" and .status == "online")] | length' 2>/dev/null) || API_FAILED=true
          if [ "${API_FAILED:-}" = "true" ]; then
            echo "runner_online=false" >> "$GITHUB_OUTPUT"
            echo "status=unverifiable" >> "$GITHUB_OUTPUT"
            echo "::warning::school-core-mac liveness unverifiable (RUNNER_ADMIN_TOKEN missing/invalid) — skipping issue execution this cycle"
          else
            ONLINE=${ONLINE:-0}
            case "$ONLINE" in
              ''|*[!0-9]*) ONLINE=0 ;;
            esac
            if [ "$ONLINE" -ge 1 ]; then
              echo "runner_online=true" >> "$GITHUB_OUTPUT"
              echo "status=online" >> "$GITHUB_OUTPUT"
              echo "school-core-mac online — execution job will run"
            else
              echo "runner_online=false" >> "$GITHUB_OUTPUT"
              echo "status=offline" >> "$GITHUB_OUTPUT"
              echo "::warning::school-core-mac offline — skipping issue execution this cycle"
            fi
          fi

  gate-blocked:
    # Signals a blocked cycle WITHOUT breaking the board publisher.
    # `execute` depends on `gate` (which succeeds), NOT on this job — so the
    # board stays up. But `gh run list` shows red because this job fails.
    name: BLOCKED — runner not online
    needs: gate
    runs-on: ubuntu-latest
    if: always() && needs.gate.outputs.runner_online == 'false'
    continue-on-error: false
    steps:
      - name: Fail the run
        run: |
          STATUS="${{ needs.gate.outputs.status }}"
          if [ "$STATUS" = "unverifiable" ]; then
            echo "::error::BLOCKED: runner liveness unverifiable (RUNNER_ADMIN_TOKEN) — issue execution skipped"
          else
            echo "::error::BLOCKED: runner offline — issue execution skipped"
          fi
          exit 1

  pipeline-alert:
    # Separate from `gate`: a checkout or AgentMail failure must never make
    # the gate red, because `execute` relies on gate success to publish the board.
    name: alert if school loop is blocked
    needs: gate
    runs-on: ubuntu-latest
    if: always() && needs.gate.outputs.runner_online == 'false'
    continue-on-error: true
    steps:
      - name: Check out notification code
        uses: actions/checkout@v4

      - name: Notify pipeline blocked
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_SCHOOL_INBOX: vault-synthesis@agentmail.to
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATE_STATUS: ${{ needs.gate.outputs.status }}
        run: |
          # Best-effort: this job is isolated and cannot block board publishing.
          python - <<'PY'
          import os
          from school_mail import notify_pipeline_alert

          status = os.environ.get("GATE_STATUS", "offline")
          if status == "unverifiable":
              reason = "The self-hosted runner liveness is unverifiable (RUNNER_ADMIN_TOKEN missing/invalid)."
          else:
              reason = "The self-hosted runner is offline (API succeeded, 0 runners online)."

          ok = notify_pipeline_alert(
              component="school-core-mac runner",
              reason=reason,
              repo=os.environ.get("GITHUB_REPOSITORY", "__global__"),
              run_url=os.environ.get("RUN_URL", ""),
          )
          print(f"notify_pipeline_alert -> {ok}, status={status}")
          PY

  execute:
    # Real issue execution + board publishing — runs ONLY on the Mac.
    # Skips execution when the Mac is asleep; the gate sends a pipeline-blocked
    # alert. Commits sanitized board state to board-publish (linear history),
    # then publishes board.html to gh-pages (stable GitHub Pages URL).
    name: execute issues + publish board
    # Shares the Mac's single Orca daemon + OmniRoute gateway with CI's live
    # integration job. This is the same cross-workflow lock as ci.yml, so
    # issue execution and integration tests cannot mutate Orca state together.
    concurrency:
      group: school-core-live-orca-${{ inputs.orca_daemon || 'default' }}
      cancel-in-progress: false
    needs: gate
    runs-on: [self-hosted, omniroute]
    permissions:
      contents: write
      issues: write
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.runner_online == 'true'
    timeout-minutes: 60
    env:
      # The secret that unlocks model calls — REQUIRED (execution fails loudly
      # without it). Same wiring as CI's integration job.
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      # Model API key for the spawned agent — Hermes needs this to make LLM calls.
      OPENROUTER_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      # AgentMail key for school-failed / retry-pending alerts.
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      # The runner runs as a LaunchAgent with a minimal PATH — re-expose it.
      PATH: /usr/local/bin:/opt/homebrew/bin:/Users/brandonbennett/.local/share/fnm/aliases/default/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
      # U8 crew dispatch: route the student-task through the FirstMate -> Orca
      # crew before the direct model path.
      CREW_ENABLED: "1"
      # Budget arithmetic — these three numbers MUST be internally consistent
      # with `timeout-minutes: 60` (3600s) above.
      CREW_MAX_PER_CYCLE: "1"
      CREW_RUNNER_SLOTS: "1"
      MAX_ISSUES_PER_CYCLE: "2"
      CREW_CYCLE_BUDGET_SECONDS: "3600"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Seed durable loop state from board-publish BEFORE the bridge runs.
      # FAIL LOUD if the seed fails — running the bridge on stale data is
      # worse than skipping the cycle (it can mark issues processed incorrectly).
      - name: Seed board state from board-publish
        run: |
          git fetch origin board-publish
          git checkout origin/board-publish -- \
            data/retry_issues.json \
            data/processed_issues.json \
            data/last_run.json

      # No actions/setup-python here: on this self-hosted runner the action's
      # tool-cache defaults to /Users/runner (a GitHub-hosted path) and fails
      # with EACCES. Use the machine's system Python + a workspace-local venv.
      - name: Set up Python (venv, cached on requirements hash)
        run: |
          set -euo pipefail
          REQ_HASH="$(shasum -a 256 requirements.txt | cut -d' ' -f1)"
          STAMP=".venv/.requirements.sha256"
          if [ -x .venv/bin/python ] && [ -f "$STAMP" ] && [ "$(cat "$STAMP")" = "$REQ_HASH" ]; then
            echo "venv up to date for requirements.txt ${REQ_HASH:0:12} — reusing"
          else
            echo "venv stale or missing — rebuilding"
            rm -rf .venv
            /usr/bin/python3 -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -r requirements.txt
            printf '%s' "$REQ_HASH" > "$STAMP"
          fi
          .venv/bin/python -c "import sys; print('python', sys.version.split()[0])"

      # Register the checkout with Orca (idempotent). Repairs the precondition
      # rather than tolerating its absence.
      - name: Register checkout with Orca
        run: |
          set -euo pipefail
          if ! orca status --json >/dev/null 2>&1; then
            echo "Orca runtime unreachable — launching it (idempotent)"
            orca open --json >/dev/null
          fi
          orca repo add --path "$PWD" --json

      # Gateway preflight: BOTH transports (OmniRoute /v1 and A2A /a2a) are
      # served by one process on localhost:20128. When it is down, every model
      # call fails and the job grinds until timeout-minutes kills it.
      - name: Gateway preflight (OmniRoute + A2A liveness)
        env:
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: .venv/bin/python gateway_preflight.py

      - name: Worktree/terminal residue audit (advisory)
        run: .venv/bin/python worktree_bloat_guard.py

      - name: FirstMate crew preflight (fm_doctor)
        env:
          FM_DOCTOR_WARN_AUTH: "1"
        run: |
          scripts/fm_doctor.sh
          echo "fm_doctor: crew setup OK — proceeding with issue execution"

      # Verify toolchain preflight (U3): nix + flake.nix#verifyShell must be
      # present for the "compiler before critic" promise to hold.
      - name: Verify toolchain preflight (nix + verifyShell)
        run: |
          NIX_BIN=$(command -v nix || echo /nix/var/nix/profiles/default/bin/nix)
          if [ ! -x "$NIX_BIN" ]; then
            echo "::error::nix not found (PATH + Determinate path) — cannot run verify gate"
            exit 1
          fi
          SHELL_NAME=$("$NIX_BIN" eval --raw .#devShells.aarch64-darwin.verifyShell.name 2>/dev/null)
          if [ -z "$SHELL_NAME" ]; then
            echo "::error::flake.nix#verifyShell did not evaluate — cannot run verify gate"
            exit 1
          fi
          echo "toolchain preflight OK — nix at $NIX_BIN, verifyShell=$SHELL_NAME"

      - name: Populate issue cache from GitHub
        run: .venv/bin/python populate_board_cache.py

      - name: Run bridge loop (executes issues)
        run: .venv/bin/python -m issue_bridge --repo "$SCHOOL_REPO" --once

      - name: Crew ledger reconciliation audit (advisory)
        if: always()
        run: .venv/bin/python crew_ledger_reconcile.py

      # Sanitize + commit board state to board-publish (linear history).
      # Runs even when the job is CANCELLED or FAILED.
      - name: Sanitize + commit board state to board-publish
        if: always()
        run: |
          .venv/bin/python scripts/sanitize_data.py --trim-trajectories --trim-consolidations data/last_run.json data/issues_cache.json data/processed_issues.json data/scores.json data/retry_issues.json data/crew_runs.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin board-publish
          git add -f data/last_run.json data/issues_cache.json data/processed_issues.json data/scores.json data/retry_issues.json data/crew_runs.json 2>/dev/null || true
          find data/trajectories -type f -exec git add -f {} + 2>/dev/null || true
          find data/sessions/consolidation -name '*.yaml' -exec git add -f {} + 2>/dev/null || true
          if git diff --quiet FETCH_HEAD -- data/ 2>/dev/null; then
            echo "checkpoint: no state changes to commit"
          else
            TREE=$(git write-tree)
            NEW=$(git commit-tree "$TREE" -p FETCH_HEAD -m "chore: checkpoint board state (sanitized) [skip ci]")
            git push origin "$NEW:board-publish" \
              && echo "checkpoint: pushed $NEW to board-publish" \
              || { echo "::warning::checkpoint push failed"; }
          fi

      # Build board.html + status.json, publish to gh-pages (stable URL).
      # Runs even when the job is CANCELLED or FAILED (so the board shows
      # last known state, not a blank page).
      - name: Build + publish board to GitHub Pages
        if: always()
        run: |
          # Build board.html from current data
          python3 -c "
          import json
          from pathlib import Path
          from board import build_board_html
          def load(ref):
              try: return json.loads(Path(ref).read_text() or '[]')
              except Exception: return []
          cache = load('data/issues_cache.json')
          proc = load('data/processed_issues.json')
          lr = load('data/last_run.json')
          cache_nums = {c.get('issue_number') for c in cache}
          for e in lr:
              n = e.get('issue')
              if n in cache_nums or n not in set(proc) or e.get('status') != 'success':
                  continue
              cache.append({'issue_number': n, 'title': e.get('title') or ('Issue #%s' % n), 'domain': e.get('domain', ''), 'difficulty': e.get('difficulty', ''), 'state': 'done'})
              cache_nums.add(n)
          Path('board.html').write_text(build_board_html(cache, proc, lr))
          print('built board.html')
          "

          # Write status.json (version breadcrumb for debugging)
          python3 -c "
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          lr = json.loads(Path('data/last_run.json').read_text() or '[]')
          proc = json.loads(Path('data/processed_issues.json').read_text() or '[]')
          status = {
              'last_updated': datetime.now(timezone.utc).isoformat(),
              'commit_sha': os.environ.get('GITHUB_SHA', 'unknown'),
              'run_id': os.environ.get('GITHUB_RUN_ID', 'unknown'),
              'runner': os.environ.get('RUNNER_NAME', 'unknown'),
              'issues_processed': len(proc),
              'last_run_entries': len(lr),
          }
          Path('status.json').write_text(json.dumps(status, indent=2))
          print('built status.json')
          "

          # Commit board.html + status.json to gh-pages branch (linear history)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages 2>/dev/null || echo "gh-pages branch does not exist yet"
          # Use a temporary index to create a clean tree with just these files
          export GIT_INDEX_FILE=$(mktemp)
          git add board.html status.json
          TREE=$(git write-tree)
          rm -f "$GIT_INDEX_FILE"
          # Parent on gh-pages tip if it exists, otherwise orphan
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            NEW=$(git commit-tree "$TREE" -p origin/gh-pages -m "chore: publish board [skip ci]")
          else
            NEW=$(git commit-tree "$TREE" -m "chore: publish board (initial) [skip ci]")
          fi
          git push origin "$NEW:gh-pages" \
            && echo "published board to gh-pages: $NEW" \
            || echo "::warning::gh-pages push failed"
