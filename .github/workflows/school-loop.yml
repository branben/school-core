# School Loop — Durable Cloud Board runner
#
# Runs the bridge loop on GitHub's servers every 5 minutes so execution
# survives laptop death.  Commits updated state back to the repo so data
# survives disk death.
#
# Axes (durability core):
#   1. EXECUTION IN CI — this workflow, not the laptop
#   2. VIEW HOSTED — board.html published to ht-ml.app (Task 6)
#   (STATE IN GIT was retired 2026-08-10: data/* contained local home paths
#   /Users/... and is no longer committed — see the commit step below.)

name: School Loop

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

env:
  # SCHOOL_REPO: override with owner/repo if this workflow runs from
  # a fork or a different repo.  The default "" lets the runner
  # self-configure — populate_board_cache.py and the bridge both
  # resolve the origin remote when SCHOOL_REPO is unset or empty.
  SCHOOL_REPO: ""
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  loop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Populate issue cache from GitHub
        run: python populate_board_cache.py

      - name: Run bridge loop
        run: python -m issue_bridge --repo "$SCHOOL_REPO" --once

      # NOTE (2026-08-10, security): data/* is deliberately NOT committed anymore.
      # last_run.json carried full local home paths (/Users/...) — PII that was
      # being force-pushed to the public repo every 5 minutes. The files still
      # regenerate on the runner and the board publish step below reads them
      # locally, but board state is no longer durable in git (was the old
      # "STATE IN GIT" durability axis). board-url.txt is still committed so
      # the current board link stays discoverable.

      - name: Publish board to ht-ml.app
        # Regenerate board.html from the just-generated local data/, re-share, and
        # record the (rotating) URL in board-url.txt so it stays discoverable.
        # ht-ml.app has no in-place update flag, so each share yields a new URL —
        # board-url.txt is the source of truth for "current board".
        run: |
          python -c "
          import json
          from pathlib import Path
          from board import build_board_html
          def load(ref):
              try: return json.loads(Path(ref).read_text() or '[]')
              except Exception: return []
          cache = load('data/issues_cache.json')
          proc = load('data/processed_issues.json')
          lr = load('data/last_run.json')
          Path('board.html').write_text(build_board_html(cache, proc, lr))
          print('regenerated board.html')
          "
          # re-share (URL rotates each time; record it)
          URL=$(npx -y lavish-axi share board.html 2>/dev/null | grep -oE 'https://[a-z0-9]+\.ht-ml\.app/' | head -1)
          echo "$URL" > board-url.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f board-url.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "chore: publish board [skip ci]" && git push)
