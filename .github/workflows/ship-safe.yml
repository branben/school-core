name: ShipSafe Security Scan

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  shipsafe:
    name: ShipSafe CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ShipSafe CLI
        run: npm install -g @shipsafe/cli

      - name: Run ShipSafe scan
        id: scan
        run: |
          shipsafe scan --scope all --json > verdicts.json 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat verdicts.json

      - name: Upload verdicts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipsafe-verdicts
          path: verdicts.json
          retention-days: 30

      - name: Fail on critical findings
        if: steps.scan.outputs.exit_code != '0'
        run: |
          echo "ShipSafe detected security issues. See verdicts.json artifact."
          exit 1
