[package]
name = "index-gate"
version = "0.1.0"
edition = "2021"
description = "Fail closed when a codebase question is answered from memory instead of a real index."

[[bin]]
name = "index-gate"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
